<html>
    <head>
        <title>MI CALCULADORA</title>
        <link rel="stylesheet" href="styles.css">

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    </head>

    <body>

        <label>MI CALCULADORA SEGURA</label>

        <br><br>

        <input type="number" id="n1" placeholder="INTRODUZCA NUMERO 1">

        <br><br>

        <select id="operacion">
            <option value="+">SUMA</option>
            <option value="-">RESTA</option>
            <option value="*">MULTIPLICACION</option>
            <option value="/">DIVISION</option>
        </select>

        <br><br>

        <input type="number" id="n2" placeholder="INTRODUZCA NUMERO 2">

        <br><br>

        <button type="button" id="accion">CALCULAR</button>

        <p id="RESULTADO"></p>

        <p>HISTORIAL</p>

        <p id="historial"></p>

        <script src="taller5.js" type="text/javascript"></script>

    </body>
</html>
